<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Contact Form Project</title>
    <link rel="stylesheet" href="contact_form.css"> 
 </head>
 
 <body>
    
<header>
    <h1> Acme Support </h1>
    <nav> 
        <ul>
            <li> Home </li>
            <li> Help </li>
            <li> Contact </li>
        </ul>
    </nav>
</header>
<hr>
<main>
<h1> Contact Us</h1>
<p class="note"> Send us a message and we will get back to you. </p>

<form action="https://httpbin.org/post" method="post">
    <fieldset>

        <div class="form-row">
        <label for="fullname"> Full name </label>
        <input type="text" name="fullname" id="fullname" autocomplete="on" required autofocus>
        </div>

<div class="form-row">
        <label for="email"> Email </label>
        <input type="text" name="email" id="email" autocomplete="on" required>
        </div>

<div class="form-row">
        <label for="subject"> Subject </label>
        <select id="subject" name="subject">
        <option value=""> Choose a topic </option>
        <option value="support"> Support </option>
        <option value="feedback"> Feedback </option>
       </select>
       </div>

<div class="form-row">
        <label for="message"> Message </label>
        <textarea id="message" name="message">
        </textarea>
</div>

    </fieldset>

<p class="note"> How did you hear about us? </p>

    <div class="radio-opt">
        <input type="radio" id="search" name="search" value="search">
        <label for="search"> Search </label>
    </div>

    <div class="radio-opt">
        <input type="radio" id="friend" name="friend" value="friend">
        <label for="friend"> Friend </label>
    </div>

    <div class="radio-opt">
        <input type="radio" id="social-media" name="social media" value="social media">
        <label for="social-media"> Social Media </label>
    </div>

    <div class="checkbox">
        <input type="checkbox" id="product-updates" name="product-updates" value="product-updates">
        <label for="product-updates"> Send me product updates </label>
    </div>

    <button> Send message </button>

</form>

</main>
<footer>
  <hr id="hr">
   &copy; Acme Support 2026 
</footer>

 </body>
 </html>
